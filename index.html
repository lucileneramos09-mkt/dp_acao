<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DP em Ação 2.0</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#183047;background:#eef4f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:22px}header{background:linear-gradient(115deg,#153d61,#247a99);color:white;padding:25px;border-radius:18px}h1{margin:4px 0}header p{color:#dcecf7}.bar{display:flex;gap:9px;flex-wrap:wrap;margin:17px 0}.pill{background:#dcecf5;border-radius:40px;padding:9px 14px}.card{background:white;border:1px solid #d5e2ed;border-radius:15px;padding:20px;margin:15px 0;box-shadow:0 3px 16px #0c2c4510}button{border:0;border-radius:9px;padding:11px 16px;background:#137ba1;color:white;font-weight:650;cursor:pointer;margin:4px}button.secondary{background:#e5eff6;color:#153d61}button:disabled{opacity:.5;cursor:not-allowed}input,select{border:1px solid #afc5d7;border-radius:8px;padding:10px;font:inherit;max-width:100%}label{display:block;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.choice{display:block;padding:13px;border:1px solid #b8cfe0;border-radius:10px;margin:9px 0;cursor:pointer}.choice:has(input:checked){background:#e2f3fa;border-color:#167a9c}.choice input{margin-right:9px}.notice{padding:13px;border-left:4px solid #1685a8;background:#e8f4fa;border-radius:8px;margin:12px 0}.error{border-color:#c74b55;background:#fff0f0}.success{border-color:#2c9c6c;background:#e7f8ef}.muted{color:#577086}.tabs{display:flex;flex-wrap:wrap;gap:5px}.tabs button{font-size:13px}.tabs button.active{background:#13445f}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:670px}th,td{border-bottom:1px solid #dce6ee;padding:9px;text-align:left;font-size:13px}th{background:#eaf2f8}td select{padding:5px;min-width:65px}.small{font-size:12px}.hide{display:none}footer{font-size:12px;color:#617b8e;padding:15px 0}@media print{header,.tabs,button,.bar,.no-print{display:none!important}.card{box-shadow:none}}
</style></head><body><div class="wrap"><header><div class="small">SIMULADOR EMPRESARIAL • DEPARTAMENTO PESSOAL</div><h1>🏢 DP em Ação 2.0</h1><p>Conecta Serviços — decisões, escalas, folha salarial e gestão de pessoas</p><button class="secondary" id="studentMode">Ambiente do aluno</button><button class="secondary" id="teacherMode">Painel da professora</button></header><div id="status" class="notice">Conectando ao Firebase...</div><main id="app"></main><footer>Simulação educacional fictícia. Parâmetros financeiros são didáticos e não substituem a legislação ou tabelas oficiais vigentes.</footer></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,signInAnonymously,signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,updateDoc,serverTimestamp,collection,query,onSnapshot} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
// SUBSTITUA PELOS DADOS DE SEU PROJETO FIREBASE (Configurações do projeto > Seus apps > Web)
const firebaseConfig={apiKey:'COLE_API_KEY',authDomain:'COLE_PROJECT_ID.firebaseapp.com',projectId:'COLE_PROJECT_ID',storageBucket:'COLE_PROJECT_ID.firebasestorage.app',messagingSenderId:'COLE_SENDER_ID',appId:'COLE_APP_ID'};
// SUBSTITUA PELO UID DA CONTA DOCENTE CRIADA EM Authentication > Users.
const TEACHER_UID='COLE_UID_DA_PROFESSORA';
const configured=!Object.values(firebaseConfig).some(v=>String(v).includes('COLE_'))&& !TEACHER_UID.includes('COLE_');
const stages=['Admissão e cadastro','Escala 5×2','Controle de ponto','Folha de pagamento','Férias e benefícios','Crise no DP'];
const employees=['Ana Souza','Bruno Lima','Carla Mendes','Diego Rocha','Elisa Costa','Felipe Alves','Gabriela Reis','Henrique Dias','Isabela Nunes','João Martins','Karen Ribeiro','Lucas Ferreira'];
const questions={0:{title:'Admissão responsável',intro:'Marina foi contratada como assistente administrativa. Qual procedimento é adequado?',opts:['Formalizar a admissão e cumprir os prazos de registro aplicáveis.','Aguardar 30 dias para decidir sobre o registro.','Pagar informalmente até o fim da experiência.'],right:0,why:'A admissão deve ser formalizada, observando os prazos legais.'},2:{title:'Controle de ponto',intro:'Pedro trabalhou 8 horas previstas, mais 1 hora extra autorizada e fez 1 hora de intervalo. Qual registro é correto?',opts:['9 horas trabalhadas, incluindo 1 extra; intervalo separado.','10 horas trabalhadas, incluindo o intervalo.','8 horas, sem registrar a hora extra.'],right:0,why:'Intervalo não integra, em regra, a jornada; a hora extra deve ser registrada.'},4:{title:'Férias e benefícios',intro:'Uma funcionária pede que a concessão das férias seja comunicada apenas na véspera. Como agir?',opts:['Aceitar, pois não existe prazo de comunicação.','Planejar e comunicar por escrito com antecedência mínima de 30 dias.','Cancelar as férias e descontar do salário.'],right:1,why:'A CLT prevê comunicação escrita das férias com antecedência mínima de 30 dias.'},5:{title:'Crise operacional',intro:'Dois funcionários apresentam atestado e a operação fica desfalcada. Qual a melhor decisão?',opts:['Obrigar qualquer pessoa de folga a trabalhar.','Alterar o ponto para esconder a ausência.','Replanejar a cobertura respeitando jornada, descansos e registros.'],right:2,why:'É necessário conciliar a continuidade da operação com os direitos trabalhistas.'}};
const $=id=>document.getElementById(id), escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=()=>({name:'',className:'',stage:0,completed:{},scores:{},answers:{},schedule:Array.from({length:12},(_,i)=>Array.from({length:7},(_,d)=>d===0||d===(i%2===0?6:1)?'F':'8')),pay:{},feedback:{},finished:false});
let app,auth,db,user=null,mode='student',data=blank(),saving=false,unsub=null,teacherRows=[];
function status(msg,error=false){$('status').textContent=msg;$('status').className='notice'+(error?' error':'');}
function total(d=data){return Object.values(d.scores||{}).reduce((s,n)=>s+Number(n||0),0)}
function note(d=data){return (total(d)/60).toFixed(1).replace('.',',')}
async function save(){if(!configured||!user||user.uid===TEACHER_UID||!data.name.trim())return; if(saving)return; saving=true;try{await setDoc(doc(db,'dpResultados',user.uid),{ownerUid:user.uid,name:data.name.trim(),className:data.className.trim(),stage:data.stage,completed:data.completed,scores:data.scores,answers:data.answers,schedule:data.schedule,pay:data.pay,feedback:data.feedback,finished:data.finished,total:total(),grade:Number((total()/60).toFixed(2)),updatedAt:serverTimestamp()});status('✓ Progresso salvo automaticamente no Firestore.')}catch(e){status('Falha ao salvar: '+e.message,true)}finally{saving=false}}
async function loadStudent(){try{const snap=await getDoc(doc(db,'dpResultados',user.uid));data=snap.exists()?{...blank(),...snap.data()}:blank();renderStudent();status('Conectado. Os resultados serão salvos no Firestore.')}catch(e){status('Não foi possível carregar: '+e.message,true)}}
async function ensureStudent(){if(!configured)return;try{if(auth.currentUser?.uid===TEACHER_UID)await signOut(auth);if(!auth.currentUser)await signInAnonymously(auth);user=auth.currentUser;await loadStudent()}catch(e){status('Erro de autenticação: '+e.message,true)}}
function renderStudent(){mode='student';if(!user){$('app').innerHTML='<div class="card">Aguardando autenticação...</div>';return}let h='<div class="card"><h2>Identificação do participante</h2><div class="grid"><label>Nome completo<input id="name" maxlength="90" value="'+escapeHTML(data.name)+'" placeholder="Nome e sobrenome"></label><label>Turma<input id="className" maxlength="60" value="'+escapeHTML(data.className)+'" placeholder="Ex.: 2º Administração"></label></div><button id="saveIdentity">Salvar identificação</button><p class="small muted">Este navegador mantém o acesso anônimo do aluno. Para retomar em outro dispositivo, é necessário um mecanismo adicional de identificação.</p></div>';
if(data.name.trim()){h+='<div class="bar"><span class="pill">Pontuação: <b>'+total()+'/600</b></span><span class="pill">Nota: <b>'+note()+'/10</b></span><span class="pill">Fases concluídas: <b>'+Object.keys(data.completed).length+'/6</b></span></div><div class="tabs">'+stages.map((s,i)=>'<button data-stage="'+i+'" '+(i>0&&!data.completed[i-1]?'disabled':'')+' class="'+(data.stage===i?'active':'')+'">'+(data.completed[i]?'✓ ':'')+(i+1)+'. '+s+'</button>').join('')+'<button data-stage="6" '+(!data.completed[5]?'disabled':'')+'>Relatório</button></div><div class="card" id="stageArea">'+renderStage()+'</div>'} $('app').innerHTML=h;
$('saveIdentity').onclick=async()=>{const name=$('name').value.trim(),className=$('className').value.trim();if(name.length<3||!className){alert('Informe nome completo e turma.');return}data.name=name;data.className=className;await save();renderStudent()};document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{data.stage=Number(b.dataset.stage);renderStudent()});wireStage()}
function renderStage(){const i=data.stage;if(i===6)return renderReport();let h='<h2>Fase '+(i+1)+' — '+stages[i]+'</h2>';if(data.completed[i])return h+'<div class="notice success">Fase concluída: <b>'+data.scores[i]+'/100 pontos</b><p>'+escapeHTML(data.feedback[i])+'</p></div><button id="nextStage">'+(i===5?'Ver relatório final':'Próxima fase')+'</button>';
if(questions[i]){const q=questions[i];h+='<h3>'+q.title+'</h3><p>'+q.intro+'</p>'+q.opts.map((o,j)=>'<label class="choice"><input type="radio" name="decision" value="'+j+'">'+escapeHTML(o)+'</label>').join('')+'<button id="submitQuiz">Confirmar decisão</button>';return h}
if(i===1){h+='<p>Monte uma escala com <b>5 dias de 8 horas</b> e <b>2 folgas</b> por colaborador. A empresa precisa de pelo menos 4 pessoas de segunda a sábado e não opera aos domingos.</p><div class="scroll"><table><thead><tr><th>Colaborador</th>'+['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+employees.map((e,r)=>'<tr><td>'+e+'</td>'+data.schedule[r].map((v,c)=>'<td><select data-r="'+r+'" data-c="'+c+'"><option value="8" '+(v==='8'?'selected':'')+'>8h</option><option value="F" '+(v==='F'?'selected':'')+'>Folga</option></select></td>').join('')+'</tr>').join('')+'</tbody></table></div><button id="validateSchedule" class="secondary">Validar escala</button><button id="submitSchedule">Entregar escala</button><div id="scheduleMsg" class="notice">Revise antes de entregar.</div>';return h}
if(i===3){h+='<p>Ana Souza: salário-base R$ 2.400,00; 10 horas extras; valor da hora R$ 12,00; adicional de 50%; desconto previdenciário <b>fictício</b> R$ 210,00 e vale-transporte R$ 120,00.</p><div class="grid">'+[['extra','Total de horas extras (R$)'],['gross','Salário bruto (R$)'],['net','Salário líquido (R$)']].map(([key,label])=>'<label>'+label+'<input type="number" step="0.01" min="0" data-pay="'+key+'" value="'+escapeHTML(data.pay[key]??'')+'"></label>').join('')+'</div><button id="submitPayroll">Conferir folha</button>';return h}return h}
function wireStage(){if(!data.name.trim())return;const i=data.stage;if(i===6){const b=$('print');if(b)b.onclick=()=>window.print();return}if(data.completed[i]){$('nextStage').onclick=()=>{data.stage=Math.min(6,i+1);renderStudent()};return}
if(questions[i])$('submitQuiz').onclick=async()=>{const chosen=document.querySelector('input[name="decision"]:checked');if(!chosen){alert('Selecione uma alternativa.');return}const a=Number(chosen.value),q=questions[i],correct=a===q.right;data.answers[i]={selected:a,options:q.opts,correct:q.right};await finish(i,correct?100:35,(correct?'Decisão correta. ':'Decisão incorreta. ')+q.why)};
if(i===1){document.querySelectorAll('[data-r]').forEach(el=>el.onchange=()=>{data.schedule[Number(el.dataset.r)][Number(el.dataset.c)]=el.value});$('validateSchedule').onclick=()=>checkSchedule(false);$('submitSchedule').onclick=()=>checkSchedule(true)}
if(i===3){document.querySelectorAll('[data-pay]').forEach(el=>el.oninput=()=>{data.pay[el.dataset.pay]=el.value});$('submitPayroll').onclick=async()=>{const expected={extra:180,gross:2580,net:2250};let n=Object.keys(expected).filter(k=>data.pay[k]!==''&&data.pay[k]!==undefined&&Math.abs(Number(data.pay[k])-expected[k])<.011).length;await finish(3,Math.round(n/3*100),n+'/3 cálculos corretos. Gabarito: extras R$ 180; bruto R$ 2.580; líquido R$ 2.250.')}}}
async function checkSchedule(submit){const bad=data.schedule.filter(r=>r.filter(x=>x==='8').length!==5).length;const sunday=data.schedule.filter(r=>r[0]==='8').length;const short=Array.from({length:6},(_,i)=>data.schedule.filter(r=>r[i+1]==='8').length).filter(n=>n<4).length;const ok=!bad&&!sunday&&!short;const msg=(ok?'Escala válida. ':'Escala precisa de ajustes. ')+bad+' colaborador(es) fora de 40h; '+short+' dia(s) com cobertura insuficiente; '+sunday+' pessoa(s) trabalhando no domingo.';if(!submit){$('scheduleMsg').textContent=msg;$('scheduleMsg').className='notice '+(ok?'success':'error');return}await finish(1,ok?100:Math.max(15,100-bad*10-short*10-(sunday?15:0)),msg)}
async function finish(i,points,feedback){if(data.completed[i])return;data.scores[i]=points;data.completed[i]=true;data.feedback[i]=feedback;data.finished=Object.keys(data.completed).length===6;await save();renderStudent()}
function renderReport(){return '<h2>Relatório final — DP em Ação</h2><p><b>Participante:</b> '+escapeHTML(data.name)+'<br><b>Turma:</b> '+escapeHTML(data.className)+'</p><h1>'+total()+'/600 pontos · Nota '+note()+'</h1><div class="scroll"><table><thead><tr><th>Fase</th><th>Pontos</th><th>Feedback</th></tr></thead><tbody>'+stages.map((s,i)=>'<tr><td>'+s+'</td><td>'+(data.scores[i]??'—')+'</td><td>'+escapeHTML(data.feedback[i]??'Pendente')+'</td></tr>').join('')+'</tbody></table></div><button id="print">Imprimir / salvar PDF</button>'}
function renderTeacherLogin(){mode='teacher';$('app').innerHTML='<div class="card"><h2>🔒 Acesso da professora</h2><p>Entre com a conta docente cadastrada no Firebase Authentication.</p><label>E-mail<input type="email" id="email" autocomplete="username"></label><label>Senha<input type="password" id="password" autocomplete="current-password"></label><button id="login">Entrar no painel</button></div>';$('login').onclick=async()=>{try{await signOut(auth);const result=await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);user=result.user;if(user.uid!==TEACHER_UID){await signOut(auth);throw Error('Esta conta não está autorizada como professora. Confira o UID.')}renderTeacher();listenTeacher()}catch(e){status('Acesso não autorizado: '+e.message,true)}}}
function listenTeacher(){if(unsub)unsub();unsub=onSnapshot(query(collection(db,'dpResultados')),snap=>{teacherRows=snap.docs.map(d=>({id:d.id,...d.data()}));renderTeacher();status('Painel atualizado em tempo real: '+teacherRows.length+' participante(s).')},e=>status('Erro ao consultar resultados: '+e.message,true))}
function renderTeacher(){mode='teacher';const rows=[...teacherRows].sort((a,b)=>String(a.className||'').localeCompare(String(b.className||''))||String(a.name||'').localeCompare(String(b.name||'')));$('app').innerHTML='<div class="card"><h2>📊 Painel da professora</h2><p>Participantes: <b>'+rows.length+'</b> · Concluíram: <b>'+rows.filter(r=>r.finished).length+'</b> · Em andamento: <b>'+rows.filter(r=>!r.finished).length+'</b></p><button id="export">Exportar CSV para Excel</button><button id="logout" class="secondary">Sair do painel</button><div class="scroll"><table><thead><tr><th>Nome</th><th>Turma</th><th>Fases</th><th>Pontos</th><th>Nota</th><th>Status</th><th>Detalhes</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr><td>'+escapeHTML(r.name)+'</td><td>'+escapeHTML(r.className)+'</td><td>'+Object.keys(r.completed||{}).length+'/6</td><td>'+total(r)+'/600</td><td>'+note(r)+'</td><td>'+(r.finished?'Concluído':'Em andamento')+'</td><td><button data-detail="'+i+'">Ver</button></td></tr>').join('')+'</tbody></table></div><div id="detail"></div></div>';$('export').onclick=()=>exportCSV(rows);$('logout').onclick=async()=>{if(unsub){unsub();unsub=null}await signOut(auth);user=null;renderTeacherLogin()};document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>showDetail(rows[Number(b.dataset.detail)]))}
function showDetail(r){$('detail').innerHTML='<div class="card"><h3>'+escapeHTML(r.name)+' — '+escapeHTML(r.className)+'</h3><p>Nota: '+note(r)+' / 10</p>'+stages.map((s,i)=>'<div class="notice"><b>'+s+': '+(r.scores?.[i]??'Pendente')+'/100</b><p>'+escapeHTML(r.feedback?.[i]??'Sem resposta')+'</p>'+(r.answers?.[i]?'<p>Resposta escolhida: '+escapeHTML(r.answers[i].options?.[r.answers[i].selected])+'</p>':'')+'</div>').join('')+'</div>'; $('detail').scrollIntoView({behavior:'smooth'})}
function exportCSV(rows){const headers=['Nome','Turma',...stages,'Total','Nota','Situação'];const records=rows.map(r=>[r.name,r.className,...stages.map((_,i)=>r.scores?.[i]??''),total(r),note(r),r.finished?'Concluído':'Em andamento']);const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\ufeff'+[headers,...records].map(r=>r.map(quote).join(';')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='resultados-dp-em-acao.csv';a.click();URL.revokeObjectURL(url)}
$('studentMode').onclick=async()=>{if(unsub){unsub();unsub=null}await ensureStudent()};$('teacherMode').onclick=()=>{if(!configured){status('Configure o Firebase antes de acessar.',true);return}if(user?.uid===TEACHER_UID){renderTeacher();listenTeacher()}else renderTeacherLogin()};
if(!configured){status('CONFIGURAÇÃO PENDENTE: edite firebaseConfig e TEACHER_UID no arquivo index.html antes de publicar.',true);$('app').innerHTML='<div class="card"><h2>Projeto pronto para configurar</h2><p>Insira os dados do Firebase no código e publique. Consulte o arquivo README.txt.</p></div>'}else{try{app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);onAuthStateChanged(auth,u=>{user=u;if(mode==='student'&&u&&u.uid!==TEACHER_UID)loadStudent()});ensureStudent()}catch(e){status('Erro de inicialização: '+e.message,true)}}
</script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DP em Ação 2.0</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#183047;background:#eef4f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:22px}header{background:linear-gradient(115deg,#153d61,#247a99);color:white;padding:25px;border-radius:18px}h1{margin:4px 0}header p{color:#dcecf7}.bar{display:flex;gap:9px;flex-wrap:wrap;margin:17px 0}.pill{background:#dcecf5;border-radius:40px;padding:9px 14px}.card{background:white;border:1px solid #d5e2ed;border-radius:15px;padding:20px;margin:15px 0;box-shadow:0 3px 16px #0c2c4510}button{border:0;border-radius:9px;padding:11px 16px;background:#137ba1;color:white;font-weight:650;cursor:pointer;margin:4px}button.secondary{background:#e5eff6;color:#153d61}button:disabled{opacity:.5;cursor:not-allowed}input,select{border:1px solid #afc5d7;border-radius:8px;padding:10px;font:inherit;max-width:100%}label{display:block;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.choice{display:block;padding:13px;border:1px solid #b8cfe0;border-radius:10px;margin:9px 0;cursor:pointer}.choice:has(input:checked){background:#e2f3fa;border-color:#167a9c}.choice input{margin-right:9px}.notice{padding:13px;border-left:4px solid #1685a8;background:#e8f4fa;border-radius:8px;margin:12px 0}.error{border-color:#c74b55;background:#fff0f0}.success{border-color:#2c9c6c;background:#e7f8ef}.muted{color:#577086}.tabs{display:flex;flex-wrap:wrap;gap:5px}.tabs button{font-size:13px}.tabs button.active{background:#13445f}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:670px}th,td{border-bottom:1px solid #dce6ee;padding:9px;text-align:left;font-size:13px}th{background:#eaf2f8}td select{padding:5px;min-width:65px}.small{font-size:12px}.hide{display:none}footer{font-size:12px;color:#617b8e;padding:15px 0}@media print{header,.tabs,button,.bar,.no-print{display:none!important}.card{box-shadow:none}}
</style></head><body><div class="wrap"><header><div class="small">SIMULADOR EMPRESARIAL • DEPARTAMENTO PESSOAL</div><h1>🏢 DP em Ação 2.0</h1><p>Conecta Serviços — decisões, escalas, folha salarial e gestão de pessoas</p><button class="secondary" id="studentMode">Ambiente do aluno</button><button class="secondary" id="teacherMode">Painel da professora</button></header><div id="status" class="notice">Conectando ao Firebase...</div><main id="app"></main><footer>Simulação educacional fictícia. Parâmetros financeiros são didáticos e não substituem a legislação ou tabelas oficiais vigentes.</footer></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,signInAnonymously,signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,updateDoc,serverTimestamp,collection,query,onSnapshot} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
// Configuração pública do aplicativo Web Firebase
const firebaseConfig={apiKey:'AIzaSyAvRW_Gz_q2uf35K5bg-lxWNlQmKXYsx6c',authDomain:'dp-em-acao.firebaseapp.com',projectId:'dp-em-acao',storageBucket:'dp-em-acao.firebasestorage.app',messagingSenderId:'352921102683',appId:'1:352921102683:web:fabbcbf2031e1b0f37927e'};
// UID autorizado para o painel docente
const TEACHER_UID='zVa5H76FQnebokhxu1026gzDZ8F3';
const configured=!Object.values(firebaseConfig).some(v=>String(v).includes('COLE_'))&& !TEACHER_UID.includes('COLE_');
const stages=['Admissão e documentação','Rescisão contratual','Jornada e horas extras','Conferência da folha','Férias e afastamentos','Ética e decisões no DP'];
const questions={
0:{title:'Documentação de admissão',intro:'Uma empresa contratou uma assistente que iniciará as atividades na segunda-feira. O RH recebeu os dados cadastrais, mas ainda não providenciou o registro obrigatório. Qual é a conduta mais adequada?',opts:['Permitir o trabalho e regularizar o registro após o primeiro pagamento.','Providenciar o registro e as informações obrigatórias dentro dos prazos aplicáveis, antes do início das atividades quando exigido.','Substituir o registro por um contrato verbal durante a experiência.','Solicitar que a colaboradora trabalhe como autônoma até o cadastro ficar pronto.'],right:1,why:'O vínculo de emprego exige formalização e observância dos prazos de registro e comunicação aos sistemas oficiais.'},
1:{title:'Rescisão sem justa causa',intro:'Uma empregada com contrato por prazo indeterminado é dispensada sem justa causa por iniciativa da empresa. Qual conjunto de providências está mais adequado, considerando os direitos aplicáveis ao caso?',opts:['Pagar apenas os dias trabalhados e encerrar o contrato sem documentos.','Descontar integralmente as férias vencidas e dispensar a comunicação do desligamento.','Apurar saldo de salário, aviso-prévio, 13º proporcional, férias devidas com 1/3 e demais verbas pertinentes; cumprir as obrigações de desligamento e do FGTS.','Pagar somente o 13º proporcional, porque a dispensa foi iniciativa do empregador.'],right:2,why:'Na dispensa sem justa causa, devem ser apuradas as verbas rescisórias cabíveis, observadas as particularidades do contrato, os prazos legais e as obrigações relativas ao FGTS.'},
2:{title:'Jornada e autorização de horas extras',intro:'Uma funcionária informa que permaneceu duas horas após o expediente para concluir uma entrega, sem autorização prévia. Qual deve ser a primeira atitude responsável do Departamento Pessoal?',opts:['Excluir as duas horas do controle de ponto automaticamente.','Registrar a jornada efetivamente cumprida, apurar as circunstâncias com a gestão e avaliar o tratamento legal e remuneratório devido.','Alterar o horário de saída para coincidir com a escala contratual.','Descontar duas horas do salário como punição automática.'],right:1,why:'O controle de ponto deve refletir a jornada real; a empresa precisa apurar a ocorrência e aplicar corretamente as regras de horas extras.'},
4:{title:'Férias e afastamento médico',intro:'Uma colaboradora apresenta atestado médico durante o período de planejamento das férias. Qual decisão demonstra maior cuidado técnico?',opts:['Ignorar o atestado porque o calendário de férias já estava preparado.','Descontar os dias de afastamento das férias sem qualquer análise.','Cancelar definitivamente o direito às férias.','Conferir o período e a natureza do afastamento, verificar os efeitos legais e ajustar o planejamento antes de formalizar as férias.'],right:3,why:'Afastamentos e férias exigem análise documental e das regras aplicáveis, sem descontos ou cancelamentos automáticos.'},
5:{title:'Sigilo de dados no Departamento Pessoal',intro:'Um gestor solicita ao DP, em um grupo aberto de mensagens, o envio de atestados médicos completos de toda a equipe. Qual resposta é mais adequada?',opts:['Compartilhar os documentos completos porque a solicitação veio de um gestor.','Publicar os atestados em uma pasta acessível a todos para facilitar a conferência.','Restringir o acesso aos dados necessários, utilizar canal seguro e verificar a finalidade e a autorização para o tratamento das informações.','Enviar os atestados a todos os supervisores para garantir transparência.'],right:2,why:'Dados de saúde são sensíveis e exigem tratamento restrito, finalidade legítima e medidas de segurança adequadas.'}
};
const $=id=>document.getElementById(id), escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=()=>({name:'',className:'',stage:0,completed:{},scores:{},answers:{},schedule:[],pay:{},feedback:{},finished:false,activityVersion:3});
let app,auth,db,user=null,mode='student',data=blank(),saving=false,unsub=null,teacherRows=[],saveQueue=Promise.resolve(),saveFailed=false;
function status(msg,error=false){$('status').textContent=msg;$('status').className='notice'+(error?' error':'');}
function total(d=data){return Object.values(d.scores||{}).reduce((s,n)=>s+Number(n||0),0)}
function note(d=data){return (total(d)/60).toFixed(1).replace('.',',')}
function serializeSchedule(schedule){return []}
function deserializeSchedule(schedule){return []}
function save(){
 if(!configured||!user||user.uid===TEACHER_UID||!data.name.trim())return Promise.resolve(false);
 // Captura o estado no momento da solicitação, evitando perder gravações consecutivas.
 const uid=user.uid;
 const payload={ownerUid:uid,nome:data.name.trim(),turma:data.className.trim(),pontuacao:total(),fase:data.stage,name:data.name.trim(),className:data.className.trim(),stage:data.stage,completed:structuredClone(data.completed),scores:structuredClone(data.scores),answers:structuredClone(data.answers),schedule:serializeSchedule(data.schedule),pay:structuredClone(data.pay),feedback:structuredClone(data.feedback),finished:data.finished,activityVersion:3,total:total(),grade:Number((total()/60).toFixed(2)),updatedAt:serverTimestamp()};
 const operation=saveQueue.catch(()=>{}).then(async()=>{
  try{await setDoc(doc(db,'resultados',uid),payload);saveFailed=false;status('✓ Progresso salvo no Firestore.');return true}
  catch(e){saveFailed=true;status('Falha ao salvar: '+e.message+' — Não feche esta página. Tente salvar novamente.',true);return false}
 });
 saveQueue=operation;
 return operation;
}
async function loadStudent(){try{const snap=await getDoc(doc(db,'resultados',user.uid));data=snap.exists()&&snap.data().activityVersion===3?{...blank(),...snap.data()}:blank();data.schedule=deserializeSchedule(data.schedule);renderStudent();status('Conectado. Os resultados serão salvos no Firestore.')}catch(e){status('Não foi possível carregar: '+e.message,true)}}
async function ensureStudent(){if(!configured)return;try{if(auth.currentUser?.uid===TEACHER_UID)await signOut(auth);if(!auth.currentUser)await signInAnonymously(auth);user=auth.currentUser;await loadStudent()}catch(e){status('Erro de autenticação: '+e.message,true)}}
function renderStudent(){mode='student';if(!user){$('app').innerHTML='<div class="card">Aguardando autenticação...</div>';return}let h='<div class="card"><h2>Identificação do participante</h2><div class="grid"><label>Nome completo<input id="name" maxlength="90" value="'+escapeHTML(data.name)+'" placeholder="Nome e sobrenome"></label><label>Turma<input id="className" maxlength="60" value="'+escapeHTML(data.className)+'" placeholder="Ex.: 2º Administração"></label></div><button id="saveIdentity">Salvar identificação</button><p class="small muted">Este navegador mantém o acesso anônimo do aluno. Para retomar em outro dispositivo, é necessário um mecanismo adicional de identificação.</p></div>';
if(data.name.trim()){h+='<div class="bar"><span class="pill">Pontuação: <b>'+total()+'/600</b></span><span class="pill">Nota: <b>'+note()+'/10</b></span><span class="pill">Fases concluídas: <b>'+Object.keys(data.completed).length+'/6</b></span></div><div class="tabs">'+stages.map((s,i)=>'<button data-stage="'+i+'" '+(i>0&&!data.completed[i-1]?'disabled':'')+' class="'+(data.stage===i?'active':'')+'">'+(data.completed[i]?'✓ ':'')+(i+1)+'. '+s+'</button>').join('')+'<button data-stage="6" '+(!data.completed[5]?'disabled':'')+'>Relatório</button></div><div class="card" id="stageArea">'+renderStage()+'</div>'} if(saveFailed)h+='<div class="notice error">O último salvamento falhou. Não feche esta página. <button id="retrySave">Tentar salvar novamente</button></div>';$('app').innerHTML=h;if($('retrySave'))$('retrySave').onclick=async()=>{const ok=await save();if(ok)renderStudent()};
$('saveIdentity').onclick=async()=>{const name=$('name').value.trim(),className=$('className').value.trim();if(name.length<3||!className){alert('Informe nome completo e turma.');return}if(data.name && (data.name!==name || data.className!==className)){alert('A identificação já foi registrada e não pode ser alterada. Consulte a professora se houver erro.');return}data.name=name;data.className=className;const ok=await save();renderStudent();if(!ok)status('Falha ao salvar. Use o botão Tentar salvar novamente.',true)};document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{data.stage=Number(b.dataset.stage);renderStudent()});wireStage()}
function renderStage(){const i=data.stage;if(i===6)return renderReport();let h='<h2>Fase '+(i+1)+' — '+stages[i]+'</h2>';if(data.completed[i])return h+'<div class="notice success">Fase concluída: <b>'+data.scores[i]+'/100 pontos</b><p>'+escapeHTML(data.feedback[i])+'</p></div><button id="nextStage">'+(i===5?'Ver relatório final':'Próxima fase')+'</button>';
if(questions[i]){const q=questions[i];h+='<h3>'+q.title+'</h3><p>'+q.intro+'</p>'+q.opts.map((o,j)=>'<label class="choice"><input type="radio" name="decision" value="'+j+'">'+escapeHTML(o)+'</label>').join('')+'<button id="submitQuiz">Confirmar decisão</button>';return h}
if(i===3){h+='<p>Camila recebe salário-base de R$ 3.000,00 e realizou 8 horas extras com adicional de 50%. Para esta atividade, considere divisor mensal de 220 horas, desconto previdenciário <b>fictício</b> de R$ 270,00 e vale-transporte de R$ 150,00. Calcule as horas extras, o bruto e o líquido, sem outros reflexos ou descontos.</p><div class="grid">'+[['extra','Total de horas extras (R$)'],['gross','Salário bruto (R$)'],['net','Salário líquido (R$)']].map(([key,label])=>'<label>'+label+'<input type="number" step="0.01" min="0" data-pay="'+key+'" value="'+escapeHTML(data.pay[key]??'')+'"></label>').join('')+'</div><button id="submitPayroll">Conferir folha</button>';return h}return h}
function wireStage(){if(!data.name.trim())return;const i=data.stage;if(i===6){const b=$('print');if(b)b.onclick=()=>window.print();return}if(data.completed[i]){$('nextStage').onclick=()=>{data.stage=Math.min(6,i+1);renderStudent()};return}
if(questions[i])$('submitQuiz').onclick=async()=>{const chosen=document.querySelector('input[name="decision"]:checked');if(!chosen){alert('Selecione uma alternativa.');return}const a=Number(chosen.value),q=questions[i],correct=a===q.right;data.answers[i]={selected:a,options:q.opts,correct:q.right};await finish(i,correct?100:35,(correct?'Decisão correta. ':'Decisão incorreta. ')+q.why)};
if(i===3){document.querySelectorAll('[data-pay]').forEach(el=>el.oninput=()=>{data.pay[el.dataset.pay]=el.value});$('submitPayroll').onclick=async()=>{const expected={extra:163.64,gross:3163.64,net:2743.64};let n=Object.keys(expected).filter(k=>data.pay[k]!==''&&data.pay[k]!==undefined&&Math.abs(Number(data.pay[k])-expected[k])<.011).length;await finish(3,Math.round(n/3*100),n+'/3 cálculos corretos. Gabarito: extras R$ 163,64; bruto R$ 3.163,64; líquido R$ 2.743,64 (valores didáticos arredondados).')}}}
async function finish(i,points,feedback){if(data.completed[i])return;data.scores[i]=points;data.completed[i]=true;data.feedback[i]=feedback;data.finished=Object.keys(data.completed).length===6;const ok=await save();renderStudent();if(!ok)status('Falha ao salvar a fase. Use Tentar salvar novamente.',true)}
function renderReport(){return '<h2>Relatório final — DP em Ação</h2><p><b>Participante:</b> '+escapeHTML(data.name)+'<br><b>Turma:</b> '+escapeHTML(data.className)+'</p><h1>'+total()+'/600 pontos · Nota '+note()+'</h1><div class="scroll"><table><thead><tr><th>Fase</th><th>Pontos</th><th>Feedback</th></tr></thead><tbody>'+stages.map((s,i)=>'<tr><td>'+s+'</td><td>'+(data.scores[i]??'—')+'</td><td>'+escapeHTML(data.feedback[i]??'Pendente')+'</td></tr>').join('')+'</tbody></table></div><button id="print">Imprimir / salvar PDF</button>'}
function renderTeacherLogin(){mode='teacher';$('app').innerHTML='<div class="card"><h2>🔒 Acesso da professora</h2><p>Entre com a conta docente cadastrada no Firebase Authentication.</p><label>E-mail<input type="email" id="email" autocomplete="username"></label><label>Senha<input type="password" id="password" autocomplete="current-password"></label><button id="login">Entrar no painel</button></div>';$('login').onclick=async()=>{try{await signOut(auth);const result=await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);user=result.user;if(user.uid!==TEACHER_UID){await signOut(auth);throw Error('Esta conta não está autorizada como professora. Confira o UID.')}renderTeacher();listenTeacher()}catch(e){status('Acesso não autorizado: '+e.message,true)}}}
function listenTeacher(){if(unsub)unsub();unsub=onSnapshot(query(collection(db,'resultados')),snap=>{teacherRows=snap.docs.map(d=>({id:d.id,...d.data()}));renderTeacher();status('Painel atualizado em tempo real: '+teacherRows.length+' participante(s).')},e=>status('Erro ao consultar resultados: '+e.message,true))}
function renderTeacher(){if(!user || user.uid!==TEACHER_UID){renderTeacherLogin();return}mode='teacher';const rows=[...teacherRows].sort((a,b)=>String(a.className||'').localeCompare(String(b.className||''))||String(a.name||'').localeCompare(String(b.name||'')));$('app').innerHTML='<div class="card"><h2>📊 Painel da professora</h2><p>Participantes: <b>'+rows.length+'</b> · Concluíram: <b>'+rows.filter(r=>r.finished).length+'</b> · Em andamento: <b>'+rows.filter(r=>!r.finished).length+'</b></p><button id="export">Exportar CSV para Excel</button><button id="logout" class="secondary">Sair do painel</button><div class="scroll"><table><thead><tr><th>Nome</th><th>Turma</th><th>Fases</th><th>Pontos</th><th>Nota</th><th>Status</th><th>Detalhes</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr><td>'+escapeHTML(r.name)+'</td><td>'+escapeHTML(r.className)+'</td><td>'+Object.keys(r.completed||{}).length+'/6</td><td>'+total(r)+'/600</td><td>'+note(r)+'</td><td>'+(r.activityVersion===3?(r.finished?'Concluído':'Em andamento'):'Versão anterior')+'</td><td><button data-detail="'+i+'">Ver</button></td></tr>').join('')+'</tbody></table></div><div id="detail"></div></div>';$('export').onclick=()=>exportCSV(rows);$('logout').onclick=async()=>{if(unsub){unsub();unsub=null}await signOut(auth);user=null;renderTeacherLogin()};document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>showDetail(rows[Number(b.dataset.detail)]))}
function showDetail(r){$('detail').innerHTML='<div class="card"><h3>'+escapeHTML(r.name)+' — '+escapeHTML(r.className)+'</h3><p>Nota: '+note(r)+' / 10</p>'+stages.map((s,i)=>'<div class="notice"><b>'+s+': '+(r.scores?.[i]??'Pendente')+'/100</b><p>'+escapeHTML(r.feedback?.[i]??'Sem resposta')+'</p>'+(r.answers?.[i]?'<p>Resposta escolhida: '+escapeHTML(r.answers[i].options?.[r.answers[i].selected])+'</p>':'')+'</div>').join('')+'</div>'; $('detail').scrollIntoView({behavior:'smooth'})}
function exportCSV(rows){const headers=['Nome','Turma',...stages,'Total','Nota','Situação'];const records=rows.map(r=>[r.name,r.className,...stages.map((_,i)=>r.scores?.[i]??''),total(r),note(r),r.finished?'Concluído':'Em andamento']);const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\ufeff'+[headers,...records].map(r=>r.map(quote).join(';')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='resultados-dp-em-acao.csv';a.click();URL.revokeObjectURL(url)}
$('studentMode').onclick=async()=>{if(unsub){unsub();unsub=null}await ensureStudent()};$('teacherMode').onclick=()=>{if(!configured){status('Configure o Firebase antes de acessar.',true);return}if(user?.uid===TEACHER_UID){renderTeacher();listenTeacher()}else renderTeacherLogin()};
if(!configured){status('CONFIGURAÇÃO PENDENTE: edite firebaseConfig e TEACHER_UID no arquivo index.html antes de publicar.',true);$('app').innerHTML='<div class="card"><h2>Projeto pronto para configurar</h2><p>Insira os dados do Firebase no código e publique. Consulte o arquivo README.txt.</p></div>'}else{try{app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);onAuthStateChanged(auth,u=>{user=u;if(mode==='student'&&u&&u.uid!==TEACHER_UID)loadStudent()});ensureStudent()}catch(e){status('Erro de inicialização: '+e.message,true)}}
</script></body></html>
